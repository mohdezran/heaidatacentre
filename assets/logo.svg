<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 1060" role="img" aria-label="HE AI Data Centre logo">
  <defs>
    <linearGradient id="lg-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecd9a1"/>
      <stop offset="0.5" stop-color="#b3924f"/>
      <stop offset="1" stop-color="#8a6c33"/>
    </linearGradient>
    <linearGradient id="lg-bevel-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fe3a8"/>
      <stop offset="1" stop-color="#128a55"/>
    </linearGradient>
    <linearGradient id="lg-bevel-left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1fa76a"/>
      <stop offset="1" stop-color="#0b6b42"/>
    </linearGradient>
    <linearGradient id="lg-bevel-right" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#04331f"/>
      <stop offset="1" stop-color="#0a5c3a"/>
    </linearGradient>
    <linearGradient id="lg-bevel-bottom" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#032719"/>
      <stop offset="1" stop-color="#0a5c3a"/>
    </linearGradient>
    <linearGradient id="lg-table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f8f58"/>
      <stop offset="0.45" stop-color="#0a5c3a"/>
      <stop offset="1" stop-color="#053423"/>
    </linearGradient>
    <linearGradient id="lg-steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f5f6"/>
      <stop offset="0.35" stop-color="#cdd1d5"/>
      <stop offset="0.6" stop-color="#8f959b"/>
      <stop offset="0.82" stop-color="#aab0b6"/>
      <stop offset="1" stop-color="#7c828a"/>
    </linearGradient>
    <linearGradient id="lg-steel-2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6e8ea"/>
      <stop offset="0.4" stop-color="#b4b9be"/>
      <stop offset="0.65" stop-color="#82888f"/>
      <stop offset="1" stop-color="#9aa0a7"/>
    </linearGradient>
  </defs>

  <!-- ================= H (emerald, gem-cut) ================= -->

  <!-- Left stem: outer form, gold-edged -->
  <polygon points="152,102 332,88 314,952 166,1000"
           fill="#0a5c3a" stroke="url(#lg-gold)" stroke-width="7" stroke-linejoin="miter"/>
  <!-- bevel facets -->
  <polygon points="152,102 332,88 296,130 190,140" fill="url(#lg-bevel-top)"/>
  <polygon points="152,102 190,140 204,914 166,1000" fill="url(#lg-bevel-left)"/>
  <polygon points="332,88 314,952 280,916 296,130" fill="url(#lg-bevel-right)"/>
  <polygon points="166,1000 204,914 280,916 314,952" fill="url(#lg-bevel-bottom)"/>
  <!-- table facet -->
  <polygon points="190,140 296,130 280,916 204,914" fill="url(#lg-table)"/>
  <!-- facet edge glints -->
  <g stroke="#8ff2c4" stroke-opacity="0.35" stroke-width="2" fill="none">
    <line x1="152" y1="102" x2="190" y2="140"/>
    <line x1="332" y1="88" x2="296" y2="130"/>
    <line x1="166" y1="1000" x2="204" y2="914"/>
    <line x1="314" y1="952" x2="280" y2="916"/>
  </g>

  <!-- Bottom bar: large parallelogram, slides under the H's right stem -->
  <polygon points="826,760 1502,760 1372,936 696,936" fill="url(#lg-steel)"/>
  <polygon points="826,760 1502,760 1492,774 816,774" fill="#ffffff" opacity="0.55"/>
  <polygon points="717,922 1382,922 1372,936 696,936" fill="#5c6269" opacity="0.55"/>

  <!-- Right stem: peaked top cap, foot slides behind the bottom steel bar -->
  <polygon points="612,152 796,100 780,905 630,938"
           fill="#0a5c3a" stroke="url(#lg-gold)" stroke-width="7" stroke-linejoin="miter"/>
  <polygon points="612,152 796,100 758,148 652,188" fill="url(#lg-bevel-top)"/>
  <polygon points="612,152 652,188 664,880 630,938" fill="url(#lg-bevel-left)"/>
  <polygon points="796,100 780,905 744,872 758,148" fill="url(#lg-bevel-right)"/>
  <polygon points="630,938 664,880 744,872 780,905" fill="url(#lg-bevel-bottom)"/>
  <polygon points="652,188 758,148 744,872 664,880" fill="url(#lg-table)"/>
  <g stroke="#8ff2c4" stroke-opacity="0.35" stroke-width="2" fill="none">
    <line x1="612" y1="152" x2="652" y2="188"/>
    <line x1="796" y1="100" x2="758" y2="148"/>
    <line x1="630" y1="938" x2="664" y2="880"/>
    <line x1="780" y1="905" x2="744" y2="872"/>
  </g>

  <!-- Crossbar -->
  <polygon points="330,468 614,452 612,614 328,630"
           fill="#0a5c3a" stroke="url(#lg-gold)" stroke-width="7" stroke-linejoin="miter"/>
  <polygon points="330,468 614,452 578,486 366,498" fill="url(#lg-bevel-top)"/>
  <polygon points="330,468 366,498 366,598 328,630" fill="url(#lg-bevel-left)"/>
  <polygon points="614,452 612,614 578,584 578,486" fill="url(#lg-bevel-right)"/>
  <polygon points="328,630 366,598 578,584 612,614" fill="url(#lg-bevel-bottom)"/>
  <polygon points="366,498 578,486 578,584 366,598" fill="url(#lg-table)"/>
  <g stroke="#8ff2c4" stroke-opacity="0.35" stroke-width="2" fill="none">
    <line x1="330" y1="468" x2="366" y2="498"/>
    <line x1="614" y1="452" x2="578" y2="486"/>
    <line x1="328" y1="630" x2="366" y2="598"/>
    <line x1="612" y1="614" x2="578" y2="584"/>
  </g>

  <!-- ================= E (steel, slanted bars) ================= -->

  <!-- Top bar: square left end, slanted right end -->
  <polygon points="848,206 1448,206 1332,348 848,348" fill="url(#lg-steel)"/>
  <polygon points="848,206 1448,206 1438,218 848,218" fill="#ffffff" opacity="0.6"/>
  <polygon points="848,334 1343,334 1332,348 848,348" fill="#5c6269" opacity="0.55"/>

  <!-- Middle bar -->
  <polygon points="848,472 1398,472 1282,614 848,614" fill="url(#lg-steel-2)"/>
  <polygon points="848,472 1398,472 1388,484 848,484" fill="#ffffff" opacity="0.5"/>
  <polygon points="848,600 1293,600 1282,614 848,614" fill="#5c6269" opacity="0.5"/>

</svg>
