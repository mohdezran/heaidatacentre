<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-label="HE AI Data Centre logo">
  <defs>
    <linearGradient id="em-face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e8a56"/>
      <stop offset="0.45" stop-color="#0a5c3b"/>
      <stop offset="1" stop-color="#063a26"/>
    </linearGradient>
    <linearGradient id="em-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ed194"/>
      <stop offset="1" stop-color="#0f7c4e"/>
    </linearGradient>
    <linearGradient id="em-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f9e63"/>
      <stop offset="1" stop-color="#07422b"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f1f2"/>
      <stop offset="0.4" stop-color="#c2c6ca"/>
      <stop offset="0.62" stop-color="#8f959b"/>
      <stop offset="1" stop-color="#b7bcc1"/>
    </linearGradient>
    <linearGradient id="steel2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9dcdf"/>
      <stop offset="0.5" stop-color="#a3a9af"/>
      <stop offset="1" stop-color="#7d838a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8d49a"/>
      <stop offset="0.5" stop-color="#b3924f"/>
      <stop offset="1" stop-color="#8a6c33"/>
    </linearGradient>
  </defs>

  <!-- H : left stem -->
  <g stroke="url(#gold)" stroke-width="5" stroke-linejoin="miter">
    <polygon points="96,44 178,32 166,488 84,476" fill="url(#em-face)"/>
  </g>
  <polygon points="104,54 170,44 150,74 118,78" fill="url(#em-top)"/>
  <polygon points="118,80 150,76 142,452 110,448" fill="url(#em-core)" opacity="0.9"/>

  <!-- H : right stem -->
  <g stroke="url(#gold)" stroke-width="5" stroke-linejoin="miter">
    <polygon points="292,58 374,46 362,474 280,462" fill="url(#em-face)"/>
  </g>
  <polygon points="300,68 366,58 346,88 314,92" fill="url(#em-top)"/>
  <polygon points="314,94 346,90 338,440 306,436" fill="url(#em-core)" opacity="0.9"/>

  <!-- H : crossbar -->
  <g stroke="url(#gold)" stroke-width="5" stroke-linejoin="miter">
    <polygon points="170,222 288,218 288,300 170,304" fill="url(#em-face)"/>
  </g>
  <polygon points="176,230 282,226 262,252 196,256" fill="url(#em-top)"/>
  <polygon points="196,258 262,254 260,284 198,288" fill="url(#em-core)" opacity="0.9"/>

  <!-- E : three steel bars -->
  <polygon points="400,96 716,96 668,164 400,164" fill="url(#steel)"/>
  <polygon points="400,96 716,96 712,104 400,104" fill="#ffffff" opacity="0.55"/>

  <polygon points="400,226 690,226 642,294 400,294" fill="url(#steel2)"/>
  <polygon points="400,226 690,226 686,234 400,234" fill="#ffffff" opacity="0.45"/>

  <polygon points="392,356 740,356 664,466 316,466" fill="url(#steel)"/>
  <polygon points="392,356 740,356 734,366 396,366" fill="#ffffff" opacity="0.5"/>
</svg>
